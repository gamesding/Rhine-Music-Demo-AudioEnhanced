<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">横竖布局共用 1.05 宽高比分界</title><desc id="desc">布局示意，非界面截图。舞台宽高比大于或等于 1.05 时专辑模型左置、信息右置；小于 1.05 时模型上置、信息下置。镜头锚点、正文位置和深夜侧向遮罩共用同一分界。</desc>
