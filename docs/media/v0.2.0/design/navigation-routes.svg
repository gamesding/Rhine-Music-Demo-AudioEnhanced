<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="792" viewBox="0 0 1280 792" role="img" aria-labelledby="title desc">
<title id="title">三种专辑导航路线与速度隔离</title><desc id="desc">交互路线示意，非逐帧录屏。主界面打开先稳定再抽取；详情上一张下一张沿队列换片；搜索跨专辑先回到专辑架，再按原浏览速度移动和重开。详情快速阻尼不改变主界面速度。</desc>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#e9eef2} .muted{fill:#a6b7c9}.blue{fill:#9ac6dd}.warm{fill:#ccb895}.label{font-size:16px;letter-spacing:1px}.body{font-size:19px}.small{font-size:17px}.heading{font-size:25px;font-weight:600}.title{font-size:32px;font-weight:650}</style>
<rect width="1280" height="792" rx="22" fill="#08131f"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#9ac6dd" stroke-width="1.4"/></marker></defs>
<text x="48" y="44" class="label blue" >01 / NAVIGATION</text>
<text x="48" y="86" class="title" >三种入口，三条明确的路线</text>
<text x="48" y="118" class="body muted" >交互路线示意 · 箭头表达先后关系，方框宽度不代表动画时长</text>
<rect x="32" y="156" width="1216" height="146" rx="14" fill="#0c1927" stroke="#213548" />
<text x="54" y="189" class="label blue" >01</text>
<text x="54" y="224" class="body" >主界面打开</text>
<text x="54" y="261" class="small muted" >原浏览节奏</text>
<rect x="32" y="322" width="1216" height="146" rx="14" fill="#0c1927" stroke="#213548" />
<text x="54" y="355" class="label blue" >02</text>
<text x="54" y="390" class="body" >详情上一张 / 下一张</text>
<text x="54" y="427" class="small muted" >保留详情取景</text>
<rect x="32" y="488" width="1216" height="146" rx="14" fill="#0c1927" stroke="#213548" />
<text x="54" y="521" class="label blue" >03</text>
<text x="54" y="556" class="body" >搜索跨专辑</text>
<text x="54" y="593" class="small muted" >回到专辑架接力</text>
<rect x="282" y="176" width="286" height="106" rx="12" fill="#111f2f" stroke="#33485b" />
<text x="300" y="207" class="body blue" >阵列稳定</text>
<text x="300" y="236" class="small muted" >当前专辑浅抬起</text>
<text x="300" y="259" class="small muted" >等待可打开状态</text>
<rect x="598" y="176" width="286" height="106" rx="12" fill="#111f2f" stroke="#33485b" />
<text x="616" y="207" class="body blue" >同步抽取与取景</text>
<text x="616" y="236" class="small muted" >盒体上抬 + 相机上抬</text>
<text x="616" y="259" class="small muted" >向右平移同时完成</text>
<rect x="914" y="176" width="286" height="106" rx="12" fill="#111f2f" stroke="#33485b" />
<text x="932" y="207" class="body blue" >详情正文进入</text>
<text x="932" y="236" class="small muted" >模型与镜头就绪</text>
<text x="932" y="259" class="small muted" >再显示专辑信息</text>
<path d="M572 230H592" fill="none" stroke="#9ac6dd" stroke-width="2" marker-end="url(#arrow)" />
<path d="M888 230H908" fill="none" stroke="#9ac6dd" stroke-width="2" marker-end="url(#arrow)" />
<rect x="282" y="342" width="286" height="106" rx="12" fill="#111f2f" stroke="#33485b" />
<text x="300" y="373" class="body blue" >正文退出</text>
<text x="300" y="402" class="small muted" >先沿原有退出动画</text>
<text x="300" y="425" class="small muted" >收起当前专辑信息</text>
<rect x="598" y="342" width="286" height="106" rx="12" fill="#111f2f" stroke="#4c6070" />
<text x="616" y="373" class="body blue" >沿队列换片</text>
<text x="616" y="402" class="small muted" >旧盒归位 + 新盒抽出</text>
<text x="616" y="425" class="small muted" >相机保持详情构图</text>
<rect x="914" y="342" width="286" height="106" rx="12" fill="#111f2f" stroke="#33485b" />
<text x="932" y="373" class="body blue" >新正文进入</text>
<text x="932" y="402" class="small muted" >新专辑就绪</text>
<text x="932" y="425" class="small muted" >恢复详情信息</text>
<path d="M572 396H592" fill="none" stroke="#9ac6dd" stroke-width="2" marker-end="url(#arrow)" />
<path d="M888 396H908" fill="none" stroke="#9ac6dd" stroke-width="2" marker-end="url(#arrow)" />
<rect x="282" y="508" width="198" height="106" rx="12" fill="#111f2f" stroke="#33485b" />
<text x="298" y="542" class="body blue" >正文退出</text>
<text x="298" y="575" class="small muted" >保留搜索目标</text>
<rect x="522" y="508" width="198" height="106" rx="12" fill="#111f2f" stroke="#33485b" />
<text x="538" y="542" class="body blue" >回到专辑架</text>
<text x="538" y="575" class="small muted" >等待完整就绪</text>
<rect x="762" y="508" width="198" height="106" rx="12" fill="#111f2f" stroke="#33485b" />
<text x="778" y="542" class="body blue" >移动目标行列</text>
<text x="778" y="575" class="small muted" >使用原浏览速度</text>
<rect x="1002" y="508" width="198" height="106" rx="12" fill="#111f2f" stroke="#33485b" />
<text x="1018" y="542" class="body blue" >重新打开</text>
<text x="1018" y="575" class="small muted" >歌曲结果定位提示</text>
<path d="M487 561H512" fill="none" stroke="#9ac6dd" stroke-width="2" marker-end="url(#arrow)" />
<path d="M727 561H752" fill="none" stroke="#9ac6dd" stroke-width="2" marker-end="url(#arrow)" />
<path d="M967 561H992" fill="none" stroke="#9ac6dd" stroke-width="2" marker-end="url(#arrow)" />
<rect x="48" y="661" width="1184" height="84" rx="12" fill="#182737" stroke="#536371" />
<text x="70" y="694" class="body warm" >速度只作用于当前路线</text>
<text x="70" y="724" class="body" >详情专用快速阻尼只在详情换片阶段启用；正常返回和搜索接力继续使用原主界面速度。</text>
</svg>
